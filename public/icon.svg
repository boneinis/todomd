<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="todomd">
  <title>todomd</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202a3b"/>
      <stop offset="0.55" stop-color="#121826"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62f6a0"/>
      <stop offset="1" stop-color="#16b364"/>
    </linearGradient>
    <linearGradient id="barTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eaf2ff"/>
      <stop offset="1" stop-color="#aebfd8"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000000" flood-opacity="0.40"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#tile)"/>
  <!-- top sheen + hairline edge for depth -->
  <rect x="24" y="24" width="464" height="232" rx="108" fill="#ffffff" opacity="0.04"/>
  <rect x="24.5" y="24.5" width="463" height="463" rx="107.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- markdown checklist: todo + md. one row verified (brand green), two pending -->
  <g filter="url(#lift)">
    <!-- row 1 — done -->
    <rect x="128" y="150" width="64" height="64" rx="18" fill="url(#green)"/>
    <path d="M147 183 l12 12 l24 -28" fill="none" stroke="#0a1f14" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="214" y="170" width="178" height="24" rx="12" fill="url(#barTop)"/>

    <!-- row 2 — in progress -->
    <rect x="128" y="246" width="64" height="64" rx="18" fill="#171f2e" stroke="#3a4760" stroke-width="4"/>
    <rect x="214" y="266" width="150" height="24" rx="12" fill="#56657f"/>

    <!-- row 3 — an agent is working it: shorter bar + a terminal cursor -->
    <rect x="128" y="342" width="64" height="64" rx="18" fill="#171f2e" stroke="#3a4760" stroke-width="4"/>
    <rect x="214" y="362" width="104" height="24" rx="12" fill="#3d4a61"/>
    <rect x="334" y="358" width="22" height="32" rx="6" fill="url(#green)"/>
  </g>
</svg>
