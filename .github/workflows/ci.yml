name: ci

# The point of this file is the thing local CI structurally cannot do: run on a
# machine that isn't the author's. Every check in `npm run ci` passes on macOS
# today while, for example, the `ps` probe in `todomd stop` was silently
# macOS-only. Linux is the baseline; Windows is here to surface that class.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false          # one Node version failing shouldn't hide the other
      matrix:
        node: ['20', '22']      # 20 is the `engines` floor, 22 is what dev uses
    name: linux · node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The full gate: suite + headless-Chrome smoke + audit + the
      # pack/install/serve stage. ubuntu-latest ships Chrome; if a future image
      # drops it the browser stage skips itself rather than failing.
      - run: npm run ci
      - name: chrome present? (informational — the stage skips without it)
        if: always()
        run: which google-chrome chromium chromium-browser 2>/dev/null || echo "no chrome on this image — UI stage skipped"

  # Not gating: todomd has never been run on Windows, and the suite makes some
  # POSIX assumptions (the `which` fallback in test/browser.js, the dispatch
  # template's shell snippet). This runs for the signal — the `stop` command's
  # missing-`ps` bug was exactly this shape and no other runner can see it.
  # Promote to a required check once it's green.
  windows:
    runs-on: windows-latest
    continue-on-error: true
    # KNOWN: test:unit HANGS on Windows (first run sat >25min while linux
    # finished in 40s; `npm ci` succeeded, the suite did not). Unfixed, and
    # non-gating on purpose. The timeout is what stops a hang from occupying a
    # runner for the 6h default — a red X here is information, not a blocker.
    timeout-minutes: 15
    name: windows · node 22 (informational)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # unit + integration only: the pack stage shells out through a POSIX-ish
      # path and the browser stage wants a Chrome lookup this file doesn't do
      # on Windows yet. Narrow on purpose — a red X here should mean a real
      # platform bug, not an untested harness.
      - run: npm run test:unit
